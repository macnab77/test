name: Flugsuche testen

on:
  push:
    paths: ["flugsuche/**", ".github/workflows/flugsuche.yml"]
  pull_request:
    paths: ["flugsuche/**", ".github/workflows/flugsuche.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r flugsuche/requirements.txt pytest
      - run: cd flugsuche && python -m pytest -q
